%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/simaai,stu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiMa.ai STU (Simple Translation Unit)

maintainers:
  - Nilesh Raghuvanshi <nilesh.r@sima.ai>

description: |
  Translates a 32-bit bus (device) address to a physical one using eight fixed
  512 MB windows. Window 0 is a driver-managed identity map.

properties:
  compatible:
    const: simaai,stu

  reg:
    maxItems: 1

  simaai,stu-gfill-value:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Global fill value written to the STU GFILL register.

  memory-region:
    minItems: 1
    maxItems: 7
    description:
      Physical reserved regions to map, in order, each fills as many consecutive
      windows as it spans, skipping blocks already reachable.

  simaai,stu-bus-range:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    description:
      Inclusive bus window range [start, end] to fill

required:
  - compatible
  - reg
  - simaai,stu-gfill-value
  - memory-region
  - simaai,stu-bus-range

additionalProperties: false

examples:
  - |
    reserved-memory {
        #address-cells = <2>;
        #size-cells = <2>;

        cma_reserved: linux,cma {
            compatible = "shared-dma-pool";
            reusable;
            reg = <0x10 0x00000000 0x0 0x6fc00000>;
        };
    };

    stu@40d3000 {
        compatible = "simaai,stu";
        reg = <0x040d3000 0x420>;
        simaai,stu-gfill-value = <0x0>;
        memory-region = <&cma_reserved>;
        simaai,stu-bus-range = <0x80000000 0xffffffff>;
    };

