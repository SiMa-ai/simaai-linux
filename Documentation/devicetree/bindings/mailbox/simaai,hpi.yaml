%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/simaai,hpi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiMa.ai HPI mailbox controller

maintainers:
  - Yurii Konovalenko <yurii.konovalenko@sima.ai>
  - Bharanidharan Ramalingam <bharanidharan.ramalingam@sima.ai>

description:
  Host Processor Interface (HPI) mailbox on SiMa.ai SoCs, providing doorbell
  message passing between the A65 host and the ARC core.

properties:
  compatible:
    const: simaai,hpi-1.0

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#mbox-cells":
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - "#mbox-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    mailbox@f0f1000 {
        compatible = "simaai,hpi-1.0";
        reg = <0x0f0f1000 0x1000>;
        interrupt-parent = <&gic>;
        interrupts = <GIC_SPI 0 IRQ_TYPE_LEVEL_HIGH>;
        #mbox-cells = <1>;
    };

