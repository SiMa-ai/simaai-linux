%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onsemi,ar0234.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: onsemi AR0234 MIPI CSI-2 global shutter sensor

maintainers:
  - Punit Singh <punit.singh@sima.ai>

description:
  The AR0234 is a 1920x1200 global shutter raw CMOS image sensor with a
  MIPI CSI-2 output of up to four lanes and an I2C control interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: onsemi,ar0234

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: XCLK input, 27 MHz.

  clock-names:
    const: xclk

  vana-supply:
    description: Analog (2.8 V) supply.

  vdig-supply:
    description: Digital core (1.8 V) supply.

  vddl-supply:
    description: Interface (1.2 V) supply.

  reset-gpios:
    description: Reset (RESET_BAR) input.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            oneOf:
              - items:
                  - const: 1
                  - const: 2
              - items:
                  - const: 1
                  - const: 2
                  - const: 3
                  - const: 4

          link-frequencies:
            minItems: 1
            maxItems: 4
            description:
              198 MHz to 450 MHz each; the per-lane bit rate is twice the link
              frequency.

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - vana-supply
  - vdig-supply
  - vddl-supply
  - port

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "onsemi,ar0234";
            reg = <0x10>;
            clocks = <&ar0234_clk>;
            clock-names = "xclk";
            vana-supply = <&ar0234_vana>;
            vdig-supply = <&ar0234_vdig>;
            vddl-supply = <&ar0234_vddl>;

            port {
                ar0234_out: endpoint {
                    remote-endpoint = <&csi_in>;
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <270000000>;
                };
            };
        };
    };
