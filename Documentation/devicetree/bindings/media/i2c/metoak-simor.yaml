%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/metoak-simor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SIMOR Depth Sensor

maintainers:
  - Sagar Kontam <sagar.kontam@sima.ai>

description: |
  The SIMOR depth sensor is a MIPI CSI-2 depth-sensing device connected
  over I2C for control. It outputs depth image data via a MIPI CSI-2
  interface using configurable data and clock lanes.

properties:
  compatible:
    const: Metoak,simor

  reg:
    maxItems: 1
    description: I2C device address of the depth sensor.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    description: |
      Video output port. The sensor has a single output port (port@1)
      connected to a MIPI CSI-2 receiver.

    properties:
      reg:
        const: 1

      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          clock-lanes:
            description: MIPI CSI-2 clock lane index.
            items:
              - const: 0

          data-lanes:
            description: |
              List of physical MIPI CSI-2 data lanes used. The sensor
              supports 2-lane operation.
            minItems: 1
            maxItems: 2

          link-frequencies:
            description: |
              Allowed MIPI CSI-2 link frequencies in Hz. Must be
              specified as a 64-bit value.
            maxItems: 1

          clock-continuous:
            description: |
              Indicates the sensor outputs a continuous clock on the
              MIPI CSI-2 clock lane.

          remote-endpoint:
            description: Reference to the CSI-2 receiver endpoint.

        required:
          - clock-lanes
          - data-lanes
          - link-frequencies
          - remote-endpoint

    required:
      - reg
      - endpoint

    additionalProperties: false

required:
  - compatible
  - reg
  - port

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        simor: simor@66 {
            compatible = "Metoak,simor";
            reg = <0x66>;

            port@1 {
                reg = <1>;
                cam20out: endpoint@0 {
                    clock-lanes = <0>;
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <540000000>;
                    remote-endpoint = <&csi20in>;
                    clock-continuous;
                };
            };
        };
    };
