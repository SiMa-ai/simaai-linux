%YAML 1.2
---
$id: http://devicetree.org/schemas/npu/simaai,mla-modalix.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiMa.ai Machine Learning Accelerator (MLA)

maintainers:
  - Vimal Nakum <vimal.nakum@sima.ai>

description:
  The Machine Learning Accelerator found on SiMa.ai Modalix SoCs. The MLA
  executes pre-compiled model binaries produced by the SiMa.ai model
  compiler; the driver exposes /dev/mla, an io_uring_cmd based interface
  used by the mla-rt / libMLArt.so userspace runtime.

  Hardware is strictly single-job-in-flight. Jobs are queued and
  dispatched by the driver, which programs the tile instruction and DMA
  descriptor blobs before each run and completes on a per-job interrupt.

properties:
  $nodename:
    pattern: '^mla@[0-9a-f]+$'

  compatible:
    enum:
      - simaai,mla-modalix

  reg:
    maxItems: 1
    description:
      The MLA AXI register window. Covers the tile, DMA and interrupt
      register banks the driver programs directly.

  interrupts:
    maxItems: 2

  interrupt-names:
    items:
      - const: ftl
      - const: non_ftl
    description: |
      ftl      - fatal interrupt. Raised on an unrecoverable hardware
                 error (for example a mosaic quadgroup timeout); the
                 driver decodes the fault status and enters recovery.
      non_ftl  - non-fatal interrupt. Carries normal job completion
                 (PROGDONE), and is the sole completion source.

  memory-region:
    maxItems: 1
    description: |
      DMS memory region carrying the label of its DMA heap. Supports
      legacy "carved-out" regions or reusable "simaai,mla-cma",
      "shared-dma-pool" regions described by
      reserved-memory/simaai,mla-cma.yaml.

  clocks:
    items:
      - description:
          Rate-controllable MLA PLL. Scaled at runtime via devfreq
          against the operating-points-v2 table.
      - description:
          MLA clock gate; enables the core and deasserts its reset.

  clock-names:
    items:
      - const: pll
      - const: gate

  operating-points-v2:
    maxItems: 1
    description: |
      Supported MLA core frequencies. Consumed through devfreq with the
      userspace governor; the initial rate is whatever the PLL reports
      at probe. OPPs carry opp-supported-hw, a bitmask matched against
      the boot PLL rate read at probe: bit 0 marks OPPs valid when the
      PLL boots at 600 MHz (100..600 MHz), bit 1 those valid when it
      boots at 1000 MHz (100..1000 MHz). Only matching OPPs are
      registered.

  simaai,reg-list:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 64
    description:
      Physical addresses of the 32-bit registers exposed by the legacy
      /dev/simaai-mlamem READ_REG/WRITE_REG ioctls, used by versions of
      mla-rt that predate /dev/mla. Userspace addresses them by index
      into this list; 0xffffffff marks an unused index. Without it,
      /dev/simaai-mlamem is not created and /dev/mla is unaffected.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - memory-region

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/simaai,clkc-prc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        mla@5000000 {
            compatible = "simaai,mla-modalix";
            reg = <0x0 0x5000000 0x0 0xfe00>;
            interrupts = <GIC_SPI 86 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 87 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "ftl", "non_ftl";
            memory-region = <&dms0_reserved>;
            clocks = <&clkc SIMAAI_PRC_CLK_MLA_PLL>,
                     <&clkc SIMAAI_PRC_CLK_MLA_GATE>;
            clock-names = "pll", "gate";
            operating-points-v2 = <&mla_opp_table>;
            simaai,reg-list = <0x0ff00014 0x0ff00594 0xffffffff 0x0ff00528
                               0x0500f438 0x0500f638 0x0500f838 0x0500fa38>;
        };
    };
